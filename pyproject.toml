[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chessrl"
version = "1.0.0"
description = "Chess reinforcement learning agent trained by self-play with JAX, Flax and PGX"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Selim Calici", email = "69143252+alcsel@users.noreply.github.com" }]
keywords = ["reinforcement-learning", "chess", "jax", "flax", "self-play", "pgx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["jax>=0.4.26", "flax>=0.8", "optax>=0.2", "pgx>=0.3", "chess>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
chessrl = "chessrl.cli:main"

[project.urls]
Homepage = "https://github.com/alcsel/Recursive-Learning-Chess"
Issues = "https://github.com/alcsel/Recursive-Learning-Chess/issues"

[tool.setuptools]
packages = ["chessrl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
